<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="coolift-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#2688FF"/>
    </linearGradient>
  </defs>

  <!-- Stylized C with Dumbbell -->
  <g transform="translate(10, 10)">
    <path d="M 40 5 A 25 25 0 1 0 40 55" fill="none" stroke="url(#coolift-grad)" stroke-width="10" stroke-linecap="round"/>
    <!-- Dumbbell inside C -->
    <rect x="22" y="27" width="18" height="6" rx="2" fill="url(#coolift-grad)"/>
    <rect x="36" y="20" width="6" height="20" rx="2" fill="url(#coolift-grad)"/>
    <rect x="44" y="23" width="5" height="14" rx="1.5" fill="url(#coolift-grad)"/>
  </g>

  <!-- COOLIFT Wordmark -->
  <text x="75" y="48" font-family="'Inter', sans-serif" font-weight="900" font-size="34" font-style="italic" fill="#FFFFFF" letter-spacing="-0.5">
    COO<tspan fill="#2688FF">LIFT</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="135" y="66" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#94A3B8" letter-spacing="1">
    Lift. Track. Evolve.
  </text>
</svg>
